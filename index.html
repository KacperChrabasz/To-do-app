<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- DIV = an invisible box that holds other things -->

    <aside class="sidebar">
      <h2 class="sidebar-title" data-i18n="myLists">📋 My lists</h2>
      <ul id="myLists"></ul>
    </aside>

    <main class="app">

      <header>
        <button id="menuBtn" class="icon-btn" data-i18n-aria="openSettings" aria-label="Open settings">☰</button>

        <div class="title-box">
          <h1 data-i18n="appTitle">My Tasks</h1>
          <div class="subtitle" id="counter"></div>
        </div>

        <label class="switch" data-i18n-aria="darkMode" aria-label="Toggle dark mode">
          <!-- LABEL = a name for something. Click the name and the thing inside reacts too -->
          <input type="checkbox" id="themeToggle">
          <!-- INPUT = a place where you write or tick. This one is a tick box -->
          <span class="slider"></span>
          <!-- SPAN = a tiny invisible box. This one is the little switch you slide -->
        </label>
      </header>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressText"></span>
      </div>

      <div class="share-row">
        <button id="shareBtn" data-i18n="copyLink">🔗 Copy invite link</button>
        <button id="newListBtn" data-i18n="newList">➕ New list</button>
      </div>

      <div class="add-row">
        <input type="text" id="taskInput" data-i18n-placeholder="addPlaceholder" placeholder="Add a new task..." maxlength="100" autocomplete="off">

        <select id="tagSelect" class="tag-select" data-i18n-aria="tagLabel" aria-label="Tag">
          <!-- TAG SELECT = a small menu next to the input. It picks the category for the NEW task -->
          <option value="" data-i18n="tagNone">No tag</option>
          <option value="work" data-i18n="tag_work">Work</option>
          <option value="school" data-i18n="tag_school">School</option>
          <option value="home" data-i18n="tag_home">Home</option>
          <option value="personal" data-i18n="tag_personal">Personal</option>
          <option value="shopping" data-i18n="tag_shopping">Shopping</option>
        </select>

        <button id="addBtn" data-i18n-aria="addTask" aria-label="Add task">+</button>
      </div>

      <div class="filters">
        <button data-filter="all" class="active" data-i18n="all">All</button>
        <button data-filter="active" data-i18n="active">Active</button>
        <button data-filter="completed" data-i18n="done">Done</button>
      </div>

      <ul id="taskList"></ul>

      <footer>
        <span id="footerInfo"></span>
        <button id="clearBtn" data-i18n="clearCompleted">Clear completed</button>
      </footer>

    </main>

    <aside class="sidebar-right">
      <!-- RIGHT SIDEBAR = a box on the right side of the page. It holds the tag filters and the sort menu -->

      <div class="side-section">
        <h2 class="sidebar-title" data-i18n="tagLabel">Tag</h2>
        <div class="tag-filters" id="tagFilters"></div>
        <!-- TAG FILTERS = an empty box. The JavaScript fills it with little buttons, one for each tag -->
      </div>

      <div class="side-section">
        <h2 class="sidebar-title" data-i18n="sortBy">Sort by</h2>
        <select id="sortSelect" data-i18n-aria="sortBy" aria-label="Sort by">
          <option value="oldest" data-i18n="sortOldest">Oldest first</option>
          <option value="newest" data-i18n="sortNewest">Newest first</option>
          <option value="az" data-i18n="sortAz">A → Z</option>
          <option value="za" data-i18n="sortZa">Z → A</option>
          <option value="manual" data-i18n="sortManual">My order (drag)</option>
          <!-- MANUAL = the order you made by dragging the ⋮⋮ handle on the tasks -->
        </select>
      </div>
    </aside>

  </div>

  <!-- SETTINGS PANEL -->
  <div class="settings-overlay" id="settingsOverlay"></div>

  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-head">
      <h2 data-i18n="settings">⚙️ Settings</h2>
      <button id="closeSettingsBtn" data-i18n-aria="closeSettings" aria-label="Close settings">✖</button>
    </div>

    <label class="setting-row">
      <span data-i18n="language">Language</span>
      <select id="languageSelect">
        <!-- SELECT = a menu where you pick one choice from a list -->
        <option value="en">English</option>
        <option value="pl">Polski</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="pt">Português</option>
      </select>
    </label>

    <label class="setting-row">
      <span data-i18n="textSize">Text size</span>
      <select id="textSizeSelect">
        <option value="small" data-i18n="small">Small</option>
        <option value="normal" data-i18n="normal">Normal</option>
        <option value="large" data-i18n="large">Large</option>
      </select>
    </label>

    <label class="setting-row">
      <span data-i18n="accent">Accent color</span>
      <select id="accentSelect">
        <option value="blue" data-i18n="colorBlue">Blue</option>
        <option value="pink" data-i18n="colorPink">Pink</option>
        <option value="green" data-i18n="colorGreen">Green</option>
        <option value="orange" data-i18n="colorOrange">Orange</option>
        <option value="purple" data-i18n="colorPurple">Purple</option>
      </select>
    </label>

    <label class="setting-row">
      <span data-i18n="compact">Compact list</span>
      <input type="checkbox" id="compactToggle">
    </label>

    <label class="setting-row">
      <span data-i18n="completedLast">Completed at the bottom</span>
      <input type="checkbox" id="completedLastToggle">
    </label>

    <label class="setting-row">
      <span data-i18n="confirmDelete">Ask before deleting</span>
      <input type="checkbox" id="confirmToggle">
    </label>
  </aside>

  <script type="module" src="script.js"></script>
</body>
</html>
