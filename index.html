<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <h2 class="sidebar-title" data-i18n="myLists">📋 My lists</h2>
      <ul id="myLists"></ul>
    </aside>

    <main class="app">

      <header>
        <button id="menuBtn" class="icon-btn" data-i18n-aria="openSettings" aria-label="Open settings">☰</button>

        <div class="title-box">
          <h1 data-i18n="appTitle">My Tasks</h1>
          <div class="subtitle" id="counter"></div>
        </div>

        <label class="switch" data-i18n-aria="darkMode" aria-label="Toggle dark mode">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </header>

      <div class="share-row">
        <button id="shareBtn" data-i18n="copyLink">🔗 Copy invite link</button>
        <button id="newListBtn" data-i18n="newList">➕ New list</button>
      </div>

      <div class="add-row">
        <input type="text" id="taskInput" data-i18n-placeholder="addPlaceholder" placeholder="Add a new task..." maxlength="100" autocomplete="off">
        <button id="addBtn" data-i18n-aria="addTask" aria-label="Add task">+</button>
      </div>

      <div class="filters">
        <button data-filter="all" class="active" data-i18n="all">All</button>
        <button data-filter="active" data-i18n="active">Active</button>
        <button data-filter="completed" data-i18n="done">Done</button>
      </div>

      <ul id="taskList"></ul>

      <footer>
        <span id="footerInfo"></span>
        <button id="clearBtn" data-i18n="clearCompleted">Clear completed</button>
      </footer>

    </main>

  </div>

  <!-- SETTINGS PANEL -->
  <div class="settings-overlay" id="settingsOverlay"></div>

  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-head">
      <h2 data-i18n="settings">⚙️ Settings</h2>
      <button id="closeSettingsBtn" data-i18n-aria="closeSettings" aria-label="Close settings">✖</button>
    </div>

    <label class="setting-row">
      <span data-i18n="language">Language</span>
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </label>

    <label class="setting-row">
      <span data-i18n="textSize">Text size</span>
      <select id="textSizeSelect">
        <option value="small" data-i18n="small">Small</option>
        <option value="normal" data-i18n="normal">Normal</option>
        <option value="large" data-i18n="large">Large</option>
      </select>
    </label>

    <label class="setting-row">
      <span data-i18n="confirmDelete">Ask before deleting</span>
      <input type="checkbox" id="confirmToggle">
    </label>
  </aside>

  <script type="module" src="script.js"></script>
</body>
</html>
